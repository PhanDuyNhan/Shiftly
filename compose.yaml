services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftly
      POSTGRES_USER: shiftly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftly -d shiftly"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npm run dev -- --hostname 0.0.0.0"]
    environment:
      DATABASE_URL: postgres://shiftly:${POSTGRES_PASSWORD:-change-me}@postgres:5432/shiftly
      PRIVATE_ATTACHMENT_DIR: /attachments
      SESSION_SECRET: ${SESSION_SECRET:-development-only-replace-me}
      APP_ORIGIN: http://localhost:3000
      DEFAULT_STORE_TIMEZONE: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - private_attachments:/attachments
volumes:
  postgres_data:
  node_modules:
  next_cache:
  private_attachments:
